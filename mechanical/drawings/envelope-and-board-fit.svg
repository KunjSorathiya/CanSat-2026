<text x="884.0" y="353.0" font-size="13" fill="#1b5e20" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace" >100 mm ≤ 120 mm  ✓</text>
<text x="884.0" y="376.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" >Board edge-on, height</text>
<text x="884.0" y="391.0" font-size="13" fill="#1b5e20" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace" >100 mm ≤ 210 mm  ✓</text>
<text x="884.0" y="414.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" >Board flat, diagonal</text>
<text x="884.0" y="429.0" font-size="13" fill="#b71c1c" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace" >141.4 mm &gt; 120 mm  ✗</text>
<text x="884.0" y="462.0" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start" >Two ways out</text>
<text x="884.0" y="486.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >1 · Mount the board edge-on as a spine.</text>
<text x="884.0" y="503.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    Costs nothing. Puts the RA-02 and its</text>
<text x="884.0" y="520.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    antenna along the axis, which is where</text>
<text x="884.0" y="537.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    they want to be anyway.</text>
<text x="884.0" y="554.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" ></text>
<text x="884.0" y="571.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >2 · Cut the board to 84.9 mm square and</text>
<text x="884.0" y="588.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    stack two decks. Costs a rebuild, and</text>
<text x="884.0" y="605.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    the current floorplan uses the full</text>
<text x="884.0" y="622.0" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start" >    100 mm in both axes.</text>
<text x="40.0" y="930.0" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Generated by tools/gen_envelope_drawing.py — do not hand-edit. Dimensions from documentation/requirements/requirements.md (GEN-004).</text>
