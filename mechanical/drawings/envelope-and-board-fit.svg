<text x="706.0" y="540.0" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" >84.9 mm</text>
<text x="706.0" y="557.0" font-size="11.5" fill="#1b5e20" font-weight="400" text-anchor="middle" >largest flat deck</text>
<text x="574.0" y="713.0" font-size="12.5" fill="#b71c1c" font-weight="600" text-anchor="start" >100 × 100 mm board laid flat — 141.4 mm diagonal</text>
<text x="574.0" y="731.0" font-size="12" fill="#b71c1c" font-weight="400" text-anchor="start" >does NOT fit a 120 mm section. Cut to 84.9 mm, or mount it edge-on.</text>
<text x="884.0" y="156.0" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start" >The arithmetic</text>
<text x="884.0" y="186.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" >Envelope section</text>
<text x="884.0" y="201.0" font-size="13" fill="#0f172a" font-weight="600" text-anchor="start" font-family="ui-monospace, Consolas, monospace" >120 mm across</text>
<text x="884.0" y="224.0" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" >Board</text>
