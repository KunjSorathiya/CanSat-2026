name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-build-and-test:
    name: Host build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compiler version
        run: g++ --version

      # A warning is a finding, not decoration. The tree is clean under the extended set
      # in tools/build_host.sh, and a new one must fail the build rather than scroll past.
      - name: Fail on any compiler warning
        run: |
          set -o pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wnon-virtual-dtor -Wcast-align -Wnull-dereference -Wdouble-promotion -Wformat=2 -Werror"             bash tools/build_host.sh > /dev/null

      # build_host.sh skips the web console suite when Node is absent. CI installs Node,
      # so a skip here means the toolchain broke, not that the tests are optional.
      - name: Build and run the host test suites
        run: |
          set -o pipefail
          bash tools/build_host.sh 2>&1 | tee host.log
          if grep -q 'SKIPPED web console tests' host.log; then
            echo "::error::web console tests were skipped in CI" >&2
            exit 1
          fi

  pico-syntax:
    name: Pico firmware syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every PICO_BUILD translation unit
        run: bash tools/check_pico_syntax.sh

  cmake-configure:
    name: CMake configure (host targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build the host CMake targets
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel

      - name: Run CTest
        run: ctest --test-dir build/ci --output-on-failure
